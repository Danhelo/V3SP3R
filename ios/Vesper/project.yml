name: Vesper
options:
  bundleIdPrefix: com.danhelo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Vesper needs Bluetooth to connect to your Flipper Zero"
    INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Vesper needs Bluetooth to communicate with your Flipper Zero"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Vesper uses the microphone for voice commands"
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Vesper uses speech recognition to process voice commands"
    INFOPLIST_KEY_NSCameraUsageDescription: "Vesper uses the camera to capture images for AI analysis"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Vesper connects to the Mentra glasses bridge on your local network"

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.25.0"

targets:
  Vesper:
    type: application
    platform: iOS
    sources:
      - path: Sources/Vesper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danhelo.vesper
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SwiftProtobuf

  VesperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danhelo.vesper.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Vesper
